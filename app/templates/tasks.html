<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>我的任務列表</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #1f2937;
      --accent-2: #374151;
      --soft: #f9fafb;
      --success: #166534;
      --danger: #b91c1c;
      --success-bg: #f0fdf4;
      --danger-bg: #fef2f2;
      --shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f9fafb 0%, #eef2f7 100%);
      min-height: 100vh;
    }
    .wrapper {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    .site-header {
      padding: 1.25rem 1rem 0;
      text-align: center;
    }
    .site-logo {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: .16em;
      text-transform: uppercase;
      border: 2px solid var(--accent);
      padding: .75rem 1rem;
      font-weight: 700;
      font-size: .88rem;
      background: white;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      max-width: 1100px;
      margin: 1rem auto 0;
      padding: .9rem 1rem;
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .topbar-title {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .ghost-button, .primary-button, .danger-button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: .72rem 1rem;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .02s ease;
    }
    .ghost-button {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--accent);
    }
    .ghost-button:hover { background: #f9fafb; }
    .primary-button {
      background: var(--accent);
      color: #fff;
    }
    .primary-button:hover { background: var(--accent-2); }
    .danger-button {
      background: #fff;
      border: 1px solid #fecaca;
      color: var(--danger);
    }
    .danger-button:hover { background: #fff5f5; }
    .ghost-button:active, .primary-button:active, .danger-button:active {
      transform: translateY(1px);
    }
    .main {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }
    .panel {
      background: var(--panel);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      padding: 1.5rem;
    }
    .section-heading {
      margin: 0 0 .4rem;
      font-size: 1.4rem;
      line-height: 1.2;
    }
    .section-subtitle {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .message {
      margin: 0 0 1rem;
      min-height: 1.5rem;
    }
    .message-box {
      border-radius: 10px;
      padding: .8rem .95rem;
      font-size: .95rem;
      line-height: 1.5;
    }
    .message-error {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid #fecaca;
    }
    .message-success {
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
    }
    .create-form {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: .9rem;
      align-items: end;
      margin-bottom: 1.5rem;
    }
    .field label {
      display: block;
      margin-bottom: .45rem;
      font-weight: 700;
      font-size: .95rem;
    }
    .field input,
    .field select,
    .table select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .82rem .9rem;
      font-size: .96rem;
      outline: none;
      background: #fff;
    }
    .field input:focus,
    .field select:focus,
    .table select:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(55,65,81,.10);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    .table th,
    .table td {
      padding: .95rem .9rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }
    .table thead th {
      background: var(--soft);
      font-size: .88rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
    }
    .table tbody tr:hover {
      background: #fafafa;
    }
    .table .actions {
      display: flex;
      gap: .55rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .empty-row {
      color: var(--muted);
      text-align: center;
      font-style: italic;
      background: #fff;
    }
    .copyright {
      text-align: center;
      color: #6b7280;
      padding: 0 1rem 1.25rem;
      font-size: .82rem;
    }
    @media (max-width: 780px) {
      .create-form {
        grid-template-columns: 1fr;
      }
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="site-header">
      <a href="/tasks" class="site-logo">STM Demo</a>
    </header>

    <nav class="topbar" aria-label="Task page navigation">
      <h1 class="topbar-title" data-testid="tasks-page-title">我的任務列表</h1>
      <button
        id="logout-button"
        class="ghost-button"
        type="button"
        data-testid="logout-button"
      >
        Logout
      </button>
    </nav>

    <main class="main">
      <section class="panel">
        <h2 class="section-heading">Task Board</h2>
        <p class="section-subtitle">建立任務、更新狀態、刪除任務，並以最小流程支撐 Playwright E2E 驗證。</p>

        <div id="tasks-message" class="message" data-testid="tasks-message" aria-live="polite"></div>

        <form id="task-create-form" class="create-form" method="post" novalidate data-testid="task-create-form">
          <div class="field">
            <label for="task-title-input">Task Title</label>
            <input
              id="task-title-input"
              name="title"
              type="text"
              placeholder="Enter a task title"
              data-testid="task-title-input"
              required
            />
          </div>

          <div class="field">
            <label for="task-status-select">Status</label>
            <select
              id="task-status-select"
              name="status"
              data-testid="task-status-select"
            >
              <option value="todo" selected>todo</option>
              <option value="doing">doing</option>
              <option value="done">done</option>
            </select>
          </div>

          <div class="field">
            <button
              id="task-create-button"
              class="primary-button"
              type="submit"
              data-testid="task-create-button"
            >
              Create Task
            </button>
          </div>
        </form>

        <div class="table-wrap">
          <table class="table" data-testid="task-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="task-table-body" data-testid="task-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="copyright">
      STM Playwright Demo
    </div>
  </div>

  <script>
    (function () {
      const token = sessionStorage.getItem('access_token');
      const userId = sessionStorage.getItem('user_id');

      if (!token || !userId) {
        window.location.href =  '/login';
        return;
      }

      const createForm = document.getElementById('task-create-form');
      const titleInput = document.getElementById('task-title-input');
      const statusSelect = document.getElementById('task-status-select');
      const tasksMessage = document.getElementById('tasks-message');
      const tableBody = document.getElementById('task-table-body');
      const logoutButton = document.getElementById('logout-button');

      function setTasksMessage(text, type) {
        tasksMessage.innerHTML = '';
        if (!text) return;

        const box = document.createElement('div');
        box.className = 'message-box';
        if (type === 'error') box.classList.add('message-error');
        if (type === 'success') box.classList.add('message-success');
        box.textContent = text;
        tasksMessage.appendChild(box);
      }

      function getAuthHeaders() {
        return {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        };
      }

      async function parseResponse(response) {
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const message =
            data && data.error && data.error.message
              ? data.error.message
              : 'Request failed';
          throw new Error(message);
        }
        return data;
      }

      function renderEmptyState() {
        tableBody.innerHTML = `
          <tr class="empty-row">
            <td colspan="3" data-testid="empty-tasks-row">目前尚無任務</td>
          </tr>
        `;
      }

      function renderTasks(tasks) {
        if (!Array.isArray(tasks) || tasks.length === 0) {
          renderEmptyState();
          return;
        }

        tableBody.innerHTML = tasks.map((task) => `
          <tr data-task-id="${task.id}" data-testid="task-row-${task.id}">
            <td data-testid="task-title-${task.id}">${escapeHtml(task.title)}</td>
            <td>
              <select
                class="row-status-select"
                data-testid="task-status-${task.id}"
                aria-label="Task status ${task.id}"
              >
                <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>todo</option>
                <option value="doing" ${task.status === 'doing' ? 'selected' : ''}>doing</option>
                <option value="done" ${task.status === 'done' ? 'selected' : ''}>done</option>
              </select>
            </td>
            <td class="actions">
              <button
                type="button"
                class="ghost-button"
                data-action="update"
                data-testid="task-update-${task.id}"
              >
                Update
              </button>
              <button
                type="button"
                class="danger-button"
                data-action="delete"
                data-testid="task-delete-${task.id}"
              >
                Delete
              </button>
            </td>
          </tr>
        `).join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      async function loadTasks() {
        try {
          const response = await fetch(`/api/v1/users/${userId}/tasks`, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });
          const tasks = await parseResponse(response);
          renderTasks(tasks);
        } catch (error) {
          renderEmptyState();
          setTasksMessage(error.message || 'Failed to load tasks.', 'error');
        }
      }

      createForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const title = titleInput.value.trim();
        const status = statusSelect.value;

        if (!title) {
          setTasksMessage('Task title is required.', 'error');
          return;
        }

        try {
          const response = await fetch(`/api/v1/users/${userId}/tasks`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ title, status })
          });

          await parseResponse(response);
          titleInput.value = '';
          statusSelect.value = 'todo';
          setTasksMessage('Task created successfully.', 'success');
          await loadTasks();
        } catch (error) {
          setTasksMessage(error.message || 'Failed to create task.', 'error');
        }
      });

      tableBody.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        const row = button.closest('tr[data-task-id]');
        if (!row) return;

        const taskId = row.dataset.taskId;
        const action = button.dataset.action;

        if (action === 'update') {
          const select = row.querySelector('.row-status-select');
          const status = select ? select.value : 'todo';

          try {
            const response = await fetch(`/api/v1/tasks/${taskId}`, {
              method: 'PATCH',
              headers: getAuthHeaders(),
              body: JSON.stringify({ status })
            });

            await parseResponse(response);
            setTasksMessage('Task updated successfully.', 'success');
            await loadTasks();
          } catch (error) {
            setTasksMessage(error.message || 'Failed to update task.', 'error');
          }
          return;
        }

        if (action === 'delete') {
          const confirmed = window.confirm('Are you sure you want to delete this task?');
          if (!confirmed) return;

          try {
            const response = await fetch(`/api/v1/tasks/${taskId}`, {
              method: 'DELETE',
              headers: {
                'Authorization': `Bearer ${token}`
              }
            });

            if (!response.ok) {
              const data = await response.json().catch(() => ({}));
              const message =
                data && data.error && data.error.message
                  ? data.error.message
                  : 'Failed to delete task.';
              throw new Error(message);
            }

            setTasksMessage('Task deleted successfully.', 'success');
            await loadTasks();
          } catch (error) {
            setTasksMessage(error.message || 'Failed to delete task.', 'error');
          }
        }
      });

      logoutButton.addEventListener('click', () => {
        sessionStorage.removeItem('access_token');
        sessionStorage.removeItem('user_id');
        window.location.href = '/login';
      });

      loadTasks();
    })();
  </script>
</body>
</html>
